name: local-software-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          python-version: '3.12'
          enable-cache: false
      - name: Install project dependencies
        run: |
          uv sync --frozen --extra dev
          npm ci --ignore-scripts
      - run: .venv/bin/python tools/check.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=software
      # CI never downloads manuals/parts or calls paid models implicitly.
      # Default local npm run test:e2e also runs the real-source reference project.
